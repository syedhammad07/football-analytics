# Keeps Midfield Matchup current: every Tuesday morning it fetches the current season's
# midfielder stats and team possession, rebuilds the page and commits the result.
name: Update Midfield Matchup

on:
  schedule:
    - cron: "17 6 * * 2"      # Tuesdays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-midfield-matchup
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install "pandas>=2.2" "numpy>=1.26" requests
      - name: Fetch this season's stats
        run: python Projects/Midfield-Matchup/fetch_current_season.py
      - name: Rebuild the page
        run: python Projects/Midfield-Matchup/build_page.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Players/Yaya-Toure-Man-City/data/external/ Projects/Midfield-Matchup/index.html
          if git diff --cached --quiet; then
            echo "No new stats since the last update."
          else
            git commit -m "Midfield Matchup: weekly stats update ($(date -u +%Y-%m-%d))"
            git push
          fi
