<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Style Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Midnight amber, broadsheet layout: hairline rules instead of cards, numbered column heads, data in mono. */
  --page:#0A0F1E; --surface:#111830; --raised:#18213D; --border:#24304F;
  --text:#EAEEF8; --muted:#8E99B5; --faint:#5D6886; --accent:#F5B13D; --dim:#3A2C10; --second:#5EA4FF;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--text)}
body{font:15px/1.5 var(--body)}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(30px,4.6vw,46px);line-height:1.04}
h2{font-size:20px;line-height:1.25;letter-spacing:-.01em}
h3{font-size:16px;line-height:1.3}
.k{font:700 11px/16px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.k.acc,.acc{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px;line-height:1.5}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
@media (max-width:640px){.wrap{padding:0 16px}}
/* masthead */
header.top{position:sticky;top:0;z-index:20;background:var(--page);border-bottom:1px solid var(--border)}
.navrow{display:flex;align-items:stretch;gap:22px;height:52px}
.brand{display:flex;gap:9px;align-items:center;font:700 13px var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.brand i{width:9px;height:9px;background:var(--accent);flex:none}
nav.links{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;align-items:stretch}
nav.links::-webkit-scrollbar{display:none}
nav.links a{display:flex;align-items:center;font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;padding-top:2px}
nav.links a:hover{color:var(--text)}
nav.links a.on{color:var(--accent);border-bottom-color:var(--accent)}
.navsearch{position:relative;width:220px;flex:none;align-self:center}
@media (max-width:1180px){.navsearch{display:none}}
@media (max-width:700px){.navrow{flex-wrap:wrap;height:auto;padding-top:12px;gap:4px}nav.links{flex-basis:100%;height:40px}}
main{padding:28px 0 48px;display:flex;flex-direction:column;gap:28px}
/* sheet + columns */
.sheet{background:var(--surface);border:1px solid var(--border)}
.shead{padding:24px 28px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.shead .meta{margin-top:8px;font:12px/18px var(--mono);color:var(--muted);letter-spacing:.03em}
.shead .meta b{color:var(--text);font-weight:400}
.cols{display:grid}
.cols > *{padding:20px 24px;min-width:0}
.cols > * + *{border-left:1px solid var(--border)}
.c3{grid-template-columns:310px minmax(0,1fr) 340px}
.c2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.c2w{grid-template-columns:330px minmax(0,1fr)}
.c2r{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)} .cmap{grid-template-columns:minmax(0,1fr) 260px}
.c3e{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4e{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.c3{grid-template-columns:300px minmax(0,1fr)}.c3 > .col3{display:none}.c4e{grid-template-columns:repeat(2,minmax(0,1fr))}.c4e > :nth-child(3){border-left:0}.c4e > :nth-child(n+3){border-top:1px solid var(--border)}}
@media (max-width:820px){.c3,.c2,.c2r,.cmap,.c2w,.c3e,.c4e{grid-template-columns:minmax(0,1fr)}.cols > * + *{border-left:0;border-top:1px solid var(--border)}.shead{padding:18px 16px}.cols > *{padding:18px 16px}}
.sec{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--border)}
.sec .k:first-child{color:var(--text)}
.stack{display:flex;flex-direction:column;gap:14px} .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lead{font-size:16px;color:var(--muted);max-width:62ch}
/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:2px;background:var(--accent);color:#1B1405;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--accent);cursor:pointer;min-height:36px}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--border)} .btn.ghost:hover{border-color:var(--muted)}
.pill{padding:6px 10px;border-radius:2px;border:1px solid var(--border);color:var(--muted);font:700 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;background:transparent;cursor:pointer;min-height:30px}
.pill:hover{color:var(--text)} .pill.on{border-color:var(--accent);color:var(--accent);background:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:2px;border:1px solid var(--border);font-size:12px;line-height:18px;white-space:nowrap;max-width:100%}
.chip i,.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
a.chip:hover{border-color:var(--muted)}
select{background:var(--page);color:var(--text);border:1px solid var(--border);border-radius:2px;padding:7px 9px;font:13px var(--body);max-width:100%;min-height:34px}
input[type=range]{accent-color:var(--accent);width:200px;max-width:100%}
label.tog{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;min-height:30px}
label.tog input{accent-color:var(--accent);width:16px;height:16px}
.search{position:relative}
.search input{width:100%;padding:8px 10px 8px 32px;border-radius:2px;border:1px solid var(--border);background:var(--page);color:var(--text);font:14px var(--body);min-height:36px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%)}
.search.big input{font-size:16px;padding:13px 14px 13px 38px;min-height:50px}
.search.big svg{left:13px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 2px);background:var(--raised);border:1px solid var(--border);z-index:30;max-height:340px;overflow-y:auto}
.sugg a{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-size:14px}
.sugg a:hover,.sugg a.hl{background:var(--dim)}
.sugg small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* figures */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));border-top:1px solid var(--border);border-left:1px solid var(--border)}
.figs > div{padding:10px 12px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.figs b{display:block;font:700 22px/28px var(--mono)} .figs small{font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.figs b.acc{color:var(--accent)}
/* bars */
.bar{display:flex;flex-direction:column;gap:4px}
.bar .lab{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.bar .lab b{font:400 12px var(--mono);white-space:nowrap}
.bar .lab b em{font-style:normal;color:var(--accent)}
.bar .lab b em.lo{color:var(--muted)}
.track{height:4px;background:var(--raised);overflow:hidden}
.track > div,.track > span{display:block;height:100%;background:var(--accent)}
.track.lo > div{background:var(--muted)}
/* tables and lists */
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
tr.link{cursor:pointer} tr.link:hover td{background:var(--raised)}
.seastrip{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}.seastrip .k{margin-right:4px}
tr.cur td{background:var(--raised)} tr.cur td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
th.sortable{cursor:pointer} th.sortable:hover{color:var(--text)}
.list > a{display:grid;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--border)}
.list > a:hover{background:var(--raised)}
.who{min-width:0} .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .who small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank{font:700 12px var(--mono);color:var(--muted)}
/* match rows */
details.match{border-bottom:1px solid var(--border)}
details.match summary{list-style:none;display:grid;grid-template-columns:26px minmax(0,1fr) auto 66px 128px 12px;gap:12px;align-items:center;padding:10px 4px;cursor:pointer}
details.match summary::-webkit-details-marker{display:none}
details.match summary:hover{background:var(--raised)}
details.match.sel summary{background:var(--raised);box-shadow:inset 2px 0 0 var(--accent)}
details.match.sel .rank{color:var(--accent)}
.chev{color:var(--muted);transition:transform .15s;font-family:var(--mono)}
details.match[open] .chev{transform:rotate(90deg)}
.ov{font:12px var(--mono);color:var(--muted);text-align:right}
.simcell{display:flex;align-items:center;gap:8px} .simcell .track{flex:1} .simcell b{font:700 14px var(--mono);width:24px;text-align:right}
.mrole{display:none}
.c3 details.match summary{grid-template-columns:26px minmax(0,1fr) 58px 116px 12px}
.c3 details.match summary .chip{display:none}
.c3 .mrole{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:1px}
.why{padding:6px 10px 16px 42px;display:flex;flex-direction:column;gap:14px}
@media (min-width:1101px){.c3 .why{display:none}}
.close3{display:flex;gap:22px;flex-wrap:wrap} .close3 div{display:flex;flex-direction:column} .close3 b{font:700 22px/26px var(--mono);color:var(--accent)} .close3 b.n2{color:var(--text)} .close3 small{font:11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.cmp2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cmp .h,.cmp .l{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px;gap:8px;align-items:center;font-size:13px}
.cmp .h{font:700 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px}
.cmp .h em{font-style:normal;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp .l{padding:5px 0;border-bottom:1px solid var(--border)} .cmp .l span{line-height:1.3}
.cmp .l b{font:400 12px var(--mono);text-align:right}
@media (max-width:820px){
  details.match summary{grid-template-columns:24px minmax(0,1fr) 100px 10px;gap:10px}
  details.match summary .chip,details.match summary .ov{display:none}
  .mrole{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:1px}
  .why{padding:6px 4px 14px}
  .cmp2{grid-template-columns:minmax(0,1fr)}
}
/* map */
.mapwrap{position:relative;width:100%;background:var(--page);overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--raised);border:1px solid var(--border);padding:6px 10px;font-size:13px;white-space:nowrap;display:none;z-index:5}
.legend{display:flex;flex-direction:column;gap:16px}
.legend button{display:flex;gap:8px;align-items:center;background:none;border:0;color:var(--text);font:13px var(--body);padding:4px 0;cursor:pointer;width:100%;text-align:left;min-height:28px}
.legend button.off{opacity:.4} .legend button.off i{background:var(--raised)!important}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.legend em{font-style:normal;color:var(--muted);margin-left:auto;font:12px var(--mono)}
/* misc */
.stackbar{display:flex;height:12px;background:var(--raised)}
.stackbar div{height:100%}
.vbars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:end;height:160px;border-bottom:1px solid var(--border)}
.vbars .c{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.vbars .c div{width:100%;max-width:48px}
.vbars .c b{font:700 13px var(--mono)}
.vlabels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:6px}
.vlabels small{font:11px var(--mono);letter-spacing:.04em;color:var(--muted);text-align:center}
.idx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--border)}
.idx a{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.idx a + a{border-left:1px solid var(--border)} .idx a:nth-child(4n+1){border-left:0}
.idx a:hover{background:var(--raised)} .idx a:hover .k{color:var(--accent)}
@media (max-width:900px){.idx{grid-template-columns:repeat(2,minmax(0,1fr))}.idx a:nth-child(odd){border-left:0}.idx a:nth-child(even){border-left:1px solid var(--border)}}
@media (max-width:520px){.idx{grid-template-columns:minmax(0,1fr)}.idx a{border-left:0!important}}
.article{display:grid;grid-template-columns:90px minmax(0,66ch);gap:0 28px;padding:28px}
.article .no{font:700 12px var(--mono);color:var(--accent);padding-top:6px;letter-spacing:.08em}
.article .body{display:flex;flex-direction:column;gap:12px;padding-bottom:28px;margin-bottom:28px;border-bottom:1px solid var(--border)}
.article .body p,.article .body li{color:#C9D1E6} .article .body ul{padding-left:18px;display:flex;flex-direction:column;gap:6px} .article .body b{color:var(--text)}
@media (max-width:640px){.article{grid-template-columns:minmax(0,1fr);padding:18px 16px}.article .no{padding-top:0}}
footer{border-top:1px solid var(--border);padding:20px 0 32px}
.sb{display:inline-flex;background:#fff;border-radius:3px;padding:6px 9px}
.sb img{height:18px;width:auto;display:block}
.empty{padding:22px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<header class="top"><div class="wrap navrow">
  <a class="brand" href="#home"><i aria-hidden="true"></i>Player Style Finder</a>
  <nav class="links" id="nav" aria-label="Pages">
    <a href="#players" data-p="players">Players</a><a href="#compare" data-p="compare">Compare</a><a href="#replace" data-p="replace">Replace</a><a href="#roles" data-p="roles">Roles</a>
    <a href="#teams" data-p="teams">Teams</a><a href="#map" data-p="map">Role map</a><a href="#misfits" data-p="misfits">Out of position</a><a href="#seasons" data-p="seasons">Seasons</a><a href="#method" data-p="method">Method</a>
  </nav>
  <div class="navsearch search" id="navsearch"></div>
</div></header>
<div class="wrap"><main id="app"><div class="empty">Loading players…</div></main></div>
<footer><div class="wrap row" style="justify-content:space-between;gap:16px">
  <div class="row" style="gap:14px"><span class="sb"><img src="img/statsbomb-logo.png" alt="StatsBomb"></span>
  <span class="xs muted" style="max-width:70ch">Data: StatsBomb open data, 2015/16 Premier League, La Liga, Serie A and Ligue 1, plus single-club seasons 2003–2024. Analysis by Syed Hammad Ovais. Not StatsBomb’s views.</span></div>
  <a class="k" href="#method">Method</a>
</div></footer>
<script>

"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LEAGUES = ["Premier League", "La Liga", "Serie A", "Ligue 1"];
const FAMS = ["Attackers", "Midfielders", "Full-backs", "Centre-backs", "Goalkeepers"];
const OUTFAMS = FAMS.slice(0, 4);
let D, T, R, X, S;        // players, teams, roles, extras, seasons
let SP = [], ALL, BYID = {}, SOLO = [];  // season profiles, every profile, profiles per player id, players with no 2015/16 profile
let F, LAB, ROLES, P, GF, GLAB;  // outfield + goalkeeper feature keys and labels, roles, players
let Z, PF, PA;            // z-scores, family percentiles, all-player percentiles
const isGK = p => p.fam === "Goalkeepers";
const sLabel = p => p.s || "2015/16";
const seaOrder = p => sLabel(p).slice(0, 7) + (p.k === "half" ? "b" + p.s : "a" + p.t);
const sShort = p => p.k === "half" ? "15/16 " + p.s.slice(8) : sLabel(p).replace(/^\d\d(\d\d)\/(\d\d)$/, "$1/$2");
const spanOf = id => { const l = BYID[id].filter(p => p.k !== "half"); const a = sLabel(l[0]), b = sLabel(l[l.length - 1]); return a === b ? a : `${a.slice(0, 4)}–20${b.slice(5)}`; };
const featsOf = p => isGK(p) ? GF : F;
const labsOf = p => isGK(p) ? GLAB : LAB;
const fi = k => F.indexOf(k);
const fiOf = (p, k) => featsOf(p).indexOf(k);
const scaleOf = p => isGK(p) ? D.gk.scale : D.scale;
const typicalOf = p => isGK(p) ? D.gk.typical_best : D.typical_best;
const groupN = p => P.filter(q => isGK(q) === isGK(p)).length;
// StatsBomb measures in yards on a 120 x 80 pitch; show metres
const CONV = { avg_x: 105 / 120, gk_avg_x: 105 / 120, sweeper_dist: 105 / 120, avg_pass_len: 0.9144, op_pass_len: 0.9144, goal_kick_len: 0.9144, carry_dist_p90: 0.9144 };

// ---------- data prep (mirrors the Python pipeline) ----------
function prepData() {
  F = D.feats; LAB = D.labels; GF = D.gk.feats; GLAB = D.gk.labels; ROLES = D.roles; P = D.players;
  const keyOf = p => (p.n + " " + p.f + " " + p.t).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  P.forEach((p, i) => { p.i = i; p.key = keyOf(p); });
  SP = S ? S.profiles : [];
  SP.forEach((p, k) => { p.i = P.length + k; p.sea = true; p.key = keyOf(p); });
  ALL = P.concat(SP);
  Z = []; PA = {}; PF = {};
  // z-scores and percentiles are always measured against the 2015/16 pool (ref); season profiles (extra) are scored against it
  const zfor = (ref, extra, feats) => {   // log for per-90 counts, as in the pipeline
    const m = feats.length, n = ref.length;
    const tx = i => ALL[i].v.map((v, j) => feats[j].endsWith("_p90") ? Math.log1p(v) : v);
    const R0 = ref.map(tx);
    const mean = Array(m).fill(0), sd = Array(m).fill(0);
    R0.forEach(r => r.forEach((v, j) => mean[j] += v / n));
    R0.forEach(r => r.forEach((v, j) => sd[j] += (v - mean[j]) ** 2 / (n - 1)));
    ref.concat(extra).forEach(i => Z[i] = tx(i).map((v, j) => (v - mean[j]) / Math.sqrt(sd[j])));
  };
  const pct = (ref, extra, m, out) => {   // percentile within ref, per feature, kept to 1-99
    for (let j = 0; j < m; j++) {
      const vals = ref.map(i => ALL[i].v[j]).sort((a, b) => a - b);
      ref.concat(extra).forEach(i => {
        const v = ALL[i].v[j]; let lo = 0, hi = vals.length;
        while (lo < hi) { const mid = (lo + hi) >> 1; vals[mid] < v ? lo = mid + 1 : hi = mid; }
        let eq = lo; while (eq < vals.length && vals[eq] === v) eq++;
        (out[i] = out[i] || [])[j] = Math.min(99, Math.max(1, Math.round(100 * (lo + (eq - lo) / 2) / vals.length)));
      });
    }
  };
  const ids = (arr, f) => arr.filter(f).map(p => p.i);
  const out = ids(P, p => !isGK(p)), gk = ids(P, isGK), sOut = ids(SP, p => !isGK(p)), sGk = ids(SP, isGK);
  zfor(out, sOut, F); zfor(gk, sGk, GF);
  pct(out, sOut, F.length, PA); pct(gk, sGk, GF.length, PA);
  FAMS.forEach(f => pct(ids(P, p => p.fam === f), ids(SP, p => p.fam === f), (f === "Goalkeepers" ? GF : F).length, PF));
  // every profile of a player, oldest season first; 2015/16 full season before its two halves
  BYID = {}; ALL.forEach(p => (BYID[p.id] = BYID[p.id] || []).push(p));
  Object.values(BYID).forEach(l => l.sort((a, b) => seaOrder(a).localeCompare(seaOrder(b))));
  SOLO = Object.values(BYID).filter(l => !l.some(p => !p.sea)).map(l => l.filter(p => p.k === "club").sort((a, b) => b.min - a.min)[0] || l[0]);

const dist = (a, b) => { let s = 0; for (let k = 0; k < a.e.length; k++) s += (a.e[k] - b.e[k]) ** 2; return Math.sqrt(s); };
const simOf = (a, b) => 100 * Math.exp(-dist(a, b) / (2 * scaleOf(a)));

  const a = ALL[i];   // the pool is always the 2015/16 players; a past season never matches the same player
  return P.filter(b => b.i !== i && !(a.sea && b.id === a.id) && isGK(b) === isGK(a) && filt(b)).map(b => ({ b, s: simOf(a, b) })).sort((x, y) => y.s - x.s).slice(0, k);
}
function fmt(p, j, v) {
  const [, unit, dp] = labsOf(p)[j], key = featsOf(p)[j];
  if (unit === "%") return (v * 100).toFixed(dp) + "%";
  if (CONV[key]) v *= CONV[key];
  if (unit === "m") return v.toFixed(dp) + " m";
  return v.toFixed(dp);
}

function explain(i, j) {
  const zi = Z[i], zj = Z[j], m = featsOf(ALL[i]).length;
  const diff = zi.map((v, k) => Math.abs(v - zj[k]));
  const sig = [...Array(m).keys()].sort((a, b) => zi[b] - zi[a]).slice(0, 12);
  const alike = sig.sort((a, b) => diff[a] - diff[b]).slice(0, 3);
  const differ = [...Array(m).keys()].sort((a, b) => diff[b] - diff[a]).slice(0, 3);
  const overlap = Math.round(100 * diff.filter(d => d <= 0.5).length / m);

}

function searchBox(host, onPick, placeholder = "Search players") {
  host.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="#8E99B5" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="#8E99B5" stroke-width="2" stroke-linecap="round"/></svg>
    <input type="search" id="${host.id}-q" placeholder="${placeholder}" autocomplete="off" aria-label="${placeholder}"><div class="sugg" hidden></div>`;
  const inp = host.querySelector("input"), box = host.querySelector(".sugg");
  let hits = [], hl = 0;
  const draw = () => {
    if (!hits.length) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = hits.map((p, k) => `<a href="#" data-i="${p.i}" class="${k === hl ? "hl" : ""}"><span>${esc(p.n)}</span><small>${p.sea ? esc([...new Set(BYID[p.id].map(q => q.t))].join(", ") + " · " + spanOf(p.id)) : esc(p.t + " · " + ROLES[p.r].name)}</small></a>`).join("");
  };
  inp.addEventListener("input", () => {
    const q = inp.value.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
    hits = q.length < 2 ? [] : P.concat(SOLO).filter(p => q.split(/\s+/).every(w => p.key.includes(w))).sort((a, b) => b.min - a.min).slice(0, 8);
    hl = 0; draw();
  });
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { hl = Math.min(hl + 1, hits.length - 1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { hl = Math.max(hl - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === "Enter" && hits[hl]) { pick(hits[hl]); e.preventDefault(); }
    else if (e.key === "Escape") { box.hidden = true; }
  });
  box.addEventListener("mousedown", e => { const a = e.target.closest("a"); if (a) { e.preventDefault(); pick(ALL[+a.dataset.i]); } });
  inp.addEventListener("blur", () => setTimeout(() => box.hidden = true, 120));
  const pick = p => { inp.value = ""; hits = []; box.hidden = true; onPick(p); };
  return inp;
}

    const nb = neighbours(q.i, () => true, 1)[0], same = isGK(q) === isGK(p);
    return `<tr class="link${q === p ? " cur" : ""}" data-i="${q.i}"><td><a href="#player-${q.i}"><b>${esc(sLabel(q))}</b></a>${q === p ? ` <span class="xs acc">shown</span>` : ""}</td><td class="muted">${esc(q.t)}</td><td class="n">${q.min.toLocaleString()}</td><td>${roleChip(q.r, false)}</td>
      <td>${nb ? `<a href="#compare-${q.i}-${nb.b.i}">${esc(nb.b.n)}</a> <span class="muted num">${Math.round(nb.s)}</span>` : "–"}</td><td class="n num">${q === p || !same ? "–" : Math.round(simOf(p, q))}</td><td><a class="pill" href="#replace-${q.i}">Replace</a></td></tr>`;
  }).join("");

    <p class="small muted" style="margin-bottom:10px">Each season is placed in the same style space as 2015/16, so every season gets its own closest 2015/16 players and its own replacements. “Like ${esc(sShort(p))}” is how close that season is to the one shown (100 = identical).</p>
    <div class="tscroll"><table class="seatab"><thead><tr><th>Season</th><th>Club</th><th class="n">Minutes</th><th>Role</th><th>Closest 2015/16 player</th><th class="n">Like ${esc(sShort(p))}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`;
}

// ---------- compare ----------
const GK_RADAR = ["save_pct", "goals_prevented_p90", "sot_faced_p90", "gk_passes_p90", "gk_pass_cmp", "short_goal_kicks", "launch_share", "goal_kick_len", "sweeper_p90", "sweeper_dist", "claims_p90", "catch_share"];
const RADAR = ["passes_p90", "prog_passes_p90", "key_passes_p90", "crosses_p90", "dribbles_p90", "prog_carries_p90", "shots_p90", "npxg_p90", "box_touch_share", "pressures_p90", "tackles_p90", "interceptions_p90", "aerials_p90", "clearances_p90"];
const radarOf = p => isGK(p) ? GK_RADAR : RADAR;
function radar(a, b) {
  const RL = radarOf(a), W = 460, c = W / 2, R = 170, n = RL.length;
  const pt = (k, v) => { const ang = -Math.PI / 2 + 2 * Math.PI * k / n; return [c + Math.cos(ang) * R * v / 100, c + Math.sin(ang) * R * v / 100]; };
  const poly = (p, col, op) => `<polygon points="${RL.map((f, k) => pt(k, Math.max(3, PA[p.i][fiOf(p, f)])).join(",")).join(" ")}" fill="${col}" fill-opacity="${op}" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
  let g = [25, 50, 75, 100].map(v => `<polygon points="${RL.map((f, k) => pt(k, v).join(",")).join(" ")}" fill="none" stroke="var(--border)" stroke-width="1"/>`).join("");
  g += RL.map((f, k) => { const [x, y] = pt(k, 100); return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--border)"/>`; }).join("");
  const labs = RL.map((f, k) => { const [x, y] = pt(k, 118); const j = fiOf(a, f); const anchor = Math.abs(x - c) < 10 ? "middle" : x > c ? "start" : "end";
    return `<text x="${x}" y="${y + 4}" text-anchor="${anchor}" fill="var(--muted)" font-size="12" font-family="IBM Plex Sans">${esc(labsOf(a)[j][0].replace(" (poss. adj.)", ""))}</text>`; }).join("");
  const ticks = [50, 100].map(v => `<text x="${c + 4}" y="${c - R * v / 100 + 12}" fill="var(--muted)" font-size="10" font-family="Space Mono">${v}</text>`).join("");
  return `<svg viewBox="-110 -20 ${W + 220} ${W + 40}" role="img" aria-label="Radar of percentiles for ${esc(a.n)} and ${esc(b.n)}">${g}${ticks}${poly(b, "#5EA4FF", .16)}${poly(a, "#F5B13D", .22)}${labs}</svg>`;
}

  if (!(bi in ALL) || bi === ai || mixed) bi = neighbours(ai, () => true, 1)[0].b.i;
  const a = ALL[ai], b = ALL[bi], s = simOf(a, b);
  const side = (p, col, id) => `<div class="stack" style="gap:8px"><span class="k" style="color:${col}">${col === "#F5B13D" ? "Player A" : "Player B"}</span>

     <span class="xs muted" style="font-family:var(--mono)">${esc(p.t)} · ${esc(p.l)} ${esc(sLabel(p))} · ${esc(p.p)} · ${p.min.toLocaleString()} min</span><div class="search" id="${id}"></div></div>`;
  const statList = isGK(a) ? GF : RADAR.concat(["pass_cmp_pct", "through_balls_p90", "avg_x", "aerial_win_pct", "recoveries_p90"]);

  app.innerHTML = `<section class="sheet">
    <div class="shead"><div><span class="k acc">Compare</span><h1 style="margin-top:6px">${esc(a.n)}${a.sea ? ` <span class="muted">${esc(sShort(a))}</span>` : ""} vs ${esc(b.n)}${b.sea ? ` <span class="muted">${esc(sShort(b))}</span>` : ""}</h1>
      <p class="meta">${isGK(a) ? `Percentiles against all ${groupN(a)} goalkeepers.` : `Percentiles against all ${groupN(a).toLocaleString()} outfield players, so positions can be compared fairly.`}${a.sea || b.sea ? " Past seasons are measured against the 2015/16 players." : ""}${mixed ? " Goalkeepers can only be compared with goalkeepers, so the second player was swapped for the closest match." : ""}</p></div></div>
    <div class="cols c2">${side(a, "#F5B13D", "cmpA")}${side(b, "#5EA4FF", "cmpB")}</div>
    <div class="cols c2r" style="border-top:1px solid var(--border)">

      <div>${sec("II. How close are they?")}<div class="stack">${whyHtml(a, b, s)}</div></div>
    </div>
    <div class="cols" style="border-top:1px solid var(--border)"><div>${sec("III. Stat by stat")}<div class="tscroll"><table><thead><tr><th>Stat</th><th class="n">${esc(lastName(a.n))}</th><th class="n">Pct</th><th class="n">${esc(lastName(b.n))}</th><th class="n">Pct</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>
  </section>`;
  app.querySelectorAll(".cols.c2 .row a.pill").forEach(x => { if (x.getAttribute("href").startsWith("#compare")) x.remove(); });
  searchBox($("#cmpA"), p => go(`compare-${p.i}-${bi}`), "Change player");
  searchBox($("#cmpB"), p => go(`compare-${ai}-${p.i}`), isGK(a) ? "Change goalkeeper" : "Change player");

pages.replace = (arg) => {

  const p = ALL[i];
  const st = { lgs: new Set(LEAGUES), excl: true, same: false, minm: 900 };
  app.innerHTML = `<section class="sheet">
    <div class="shead"><div><span class="k acc">Replace a player</span><h1 style="margin-top:6px">Who could replace ${esc(p.n)}${BYID[p.id].length > 1 || p.sea ? ` <span class="muted">${esc(sShort(p))}</span>` : ""}?</h1><p class="meta">${p.sea ? `The 2015/16 players who play most like his ${esc(sLabel(p))} season. ` : "The closest styles at other clubs. "}Open a row to see why.</p>${seasonStrip(p, "replace")}</div></div>
    <div class="cols c2w">
      <div class="stack">${sec("I. Player and filters")}
        <div class="stack" style="gap:4px"><b style="font:700 20px var(--display)"><a href="#player-${p.i}">${esc(p.n)}</a></b><span class="xs muted" style="font-family:var(--mono)">${esc(p.t)} · ${esc(p.l)} ${esc(sLabel(p))}</span><div>${roleChip(p.r)}</div></div>
        <div class="search" id="rpq"></div>
        <div class="stack" style="gap:8px"><span class="k">Leagues</span><div class="row" id="rplg">${LEAGUES.map(l => `<button class="pill on" data-l="${l}">${l}</button>`).join("")}</div></div>
        <label class="tog"><input type="checkbox" id="rpex" checked> Exclude ${esc(p.t)}</label>
        <label class="tog"><input type="checkbox" id="rpsame"> Same role only</label>
        <div class="stack" style="gap:6px"><label class="k" for="rpmin">Minimum minutes · <span id="rpminv" class="acc">900</span></label><input type="range" id="rpmin" min="900" max="3000" step="100" value="900"></div>
      </div>
      <div>${sec("II. Best replacements", `<span id="rpcount"></span>`)}<div id="rplist"></div></div>
    </div></section>`;
  searchBox($("#rpq"), q => go("replace-" + q.i), "Choose another player");
  const draw = () => {
    const nb = neighbours(i, b => st.lgs.has(b.l) && (!st.excl || b.t !== p.t) && (!st.same || b.r === p.r) && b.min >= st.minm, 15);
    $("#rpcount").textContent = `${nb.length} shown`;
    $("#rplist").innerHTML = nb.map((x, k) => matchRow(i, x, k, false).replace(' class="match sel"', ' class="match"')).join("") || `<div class="empty">No players match these filters. Try more leagues or fewer minutes.</div>`;
  };
  $("#rplg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; const l = b.dataset.l;
    st.lgs.has(l) ? st.lgs.delete(l) : st.lgs.add(l); b.classList.toggle("on", st.lgs.has(l)); draw(); });
  $("#rpex").addEventListener("change", e => { st.excl = e.target.checked; draw(); });
  $("#rpsame").addEventListener("change", e => { st.same = e.target.checked; draw(); });
  $("#rpmin").addEventListener("input", e => { st.minm = +e.target.value; $("#rpminv").textContent = st.minm.toLocaleString(); draw(); });
  draw();
};

pages.team = (arg) => {

      </div>
    </div>
    <div class="cols" style="border-top:1px solid var(--border)"><div>${sec("IV. Squad by style", "900+ minutes")}<div class="tscroll"><table><thead><tr><th>Player</th><th>Position</th><th>Role</th><th class="n">Minutes</th></tr></thead><tbody>${squad.map(p => `<tr class="link" data-i="${p.i}"><td><a href="#player-${p.i}"><b>${esc(p.n)}</b></a></td><td class="muted">${esc(p.p)}</td><td>${roleChip(p.r, false)}</td><td class="n">${p.min.toLocaleString()}</td></tr>`).join("")}</tbody></table></div></div></div>
  </section>`;
  app.querySelectorAll("tr[data-i]").forEach(tr => tr.addEventListener("click", e => { if (!e.target.closest("a")) go("player-" + tr.dataset.i); }));
};

// ---------- map (mouse + keyboard) ----------
function drawMap(host, o = {}) {
  const W = 1000, H = o.height ? o.height * 1000 / 700 : 560, pad = 18;
  const X0 = v => pad + v / 1000 * (W - 2 * pad), Y0 = v => pad + v / 1000 * (H - 2 * pad);
  const hl = new Set(o.highlight || []), nb = new Set(o.neighbours || []);
  const vis = p => (o.roleOn ? o.roleOn.has(p.r) : true) && (o.lg ? o.lg === "All" || p.l === o.lg : true);
  const shown = P.filter(p => p.x !== null);
  const active = p => !((o.role !== undefined && p.r !== o.role) || !vis(p) || (o.neighbours && !nb.has(p.i) && !hl.has(p.i)));
  const dots = shown.map(p => `<circle data-i="${p.i}" tabindex="-1" cx="${X0(p.x).toFixed(1)}" cy="${Y0(p.y).toFixed(1)}" r="${o.big ? 4 : 3.6}" fill="${ROLES[p.r].color}" fill-opacity="${active(p) ? .78 : .13}"/>`).join("");
  const rings = [...hl].map(i => { const p = P[i]; return `<circle cx="${X0(p.x)}" cy="${Y0(p.y)}" r="9" fill="none" stroke="var(--text)" stroke-width="2"/><circle cx="${X0(p.x)}" cy="${Y0(p.y)}" r="4" fill="var(--text)"/>` +
    (o.labels ? `<text x="${X0(p.x) + 13}" y="${Y0(p.y) + 4}" fill="var(--text)" font-size="${o.height ? 20 : 14}" font-family="IBM Plex Sans" paint-order="stroke" stroke="var(--page)" stroke-width="4">${esc(p.n)}</text>` : ""); }).join("");
  host.innerHTML = `<div class="mapwrap" tabindex="0" aria-label="Role map. Use arrow keys to move between players and Enter to open one."><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Role map of outfield players">${dots}${rings}<circle class="kcur" r="8" fill="none" stroke="var(--accent)" stroke-width="2.5" cx="-20" cy="-20"/></svg><div class="tip"></div></div>`;
  const wrap = host.firstChild, tip = wrap.querySelector(".tip"), svg = wrap.querySelector("svg"), cur = wrap.querySelector(".kcur");
  const showTip = (p, x, y) => { const b = wrap.getBoundingClientRect();
    tip.innerHTML = `<b>${esc(p.n)}</b> <span class="muted">· ${esc(p.t)}</span><br><span class="small" style="color:${ROLES[p.r].color}">${esc(ROLES[p.r].name)}</span>`;
    tip.style.display = "block"; tip.style.left = Math.max(4, Math.min(x + 12, b.width - tip.offsetWidth - 4)) + "px"; tip.style.top = Math.min(y + 14, b.height - tip.offsetHeight - 4) + "px"; };
  wrap.addEventListener("mousemove", e => { const c = e.target.closest("circle[data-i]"); if (!c) { tip.style.display = "none"; return; }
    const b = wrap.getBoundingClientRect(); showTip(P[+c.dataset.i], e.clientX - b.left, e.clientY - b.top); });
  wrap.addEventListener("mouseleave", () => tip.style.display = "none");
  wrap.addEventListener("click", e => { const c = e.target.closest("circle[data-i]"); if (c) go("player-" + c.dataset.i); });
  // keyboard: arrows move to the nearest active player in that direction, Enter opens
  let kc = null; const pool = shown.filter(active);
  wrap.addEventListener("keydown", e => {
    const dirs = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (e.key === "Enter" && kc) { go("player-" + kc.i); return; }
    if (e.key === "Escape") { kc = null; cur.setAttribute("cx", -20); tip.style.display = "none"; return; }
    if (!dirs[e.key]) return; e.preventDefault();
    if (!kc) kc = (hl.size ? P[[...hl][0]] : pool.slice().sort((a, b) => (a.x + a.y) - (b.x + b.y))[0]);
    else { const [dx, dy] = dirs[e.key]; let best = null, bd = Infinity;
      pool.forEach(q => { const vx = q.x - kc.x, vy = q.y - kc.y, along = vx * dx + vy * dy; if (along <= 0) return; const d = along + 2.5 * Math.abs(vx * dy - vy * dx); if (d < bd) { bd = d; best = q; } });
      if (best) kc = best; }
    cur.setAttribute("cx", X0(kc.x)); cur.setAttribute("cy", Y0(kc.y));
    const r = svg.getBoundingClientRect(), b = wrap.getBoundingClientRect(), sc = r.width / W;
    showTip(kc, X0(kc.x) * sc + (r.left - b.left), Y0(kc.y) * sc + (r.top - b.top));
  });
}
pages.map = () => {
  const st = pages.map.st = pages.map.st || { on: new Set(ROLES.map((_, k) => k)), lg: "All", sel: null };
  app.innerHTML = `<section class="sheet">
    <div class="shead"><div><span class="k acc">Role map</span><h1 style="margin-top:6px">Every outfield player on one map</h1><p class="meta">Players close together play alike. Hover or use the arrow keys to see who a dot is; click or press Enter to open the player.</p></div></div>
    <div class="cols cmap">
      <div class="stack"><div class="row"><div class="search" id="mapq" style="flex:1;min-width:200px"></div><select id="maplg" aria-label="League"><option>All</option>${LEAGUES.map(l => `<option>${l}</option>`).join("")}</select></div><div id="bigmap"></div>
        <p class="xs muted">A 2D projection (UMAP) of the 8-dimension style space. Axes have no units; neighbours are reliable, long distances are not.</p></div>
      <div class="legend" id="leg">${OUTFAMS.map(f => `<div>${sec(f)}${ROLES.map((r, k) => [r, k]).filter(([r]) => r.family === f).map(([r, k]) => `<button data-k="${k}" class="${st.on.has(k) ? "" : "off"}" aria-pressed="${st.on.has(k)}"><i style="background:${r.color}"></i>${esc(r.name)}<em>${P.filter(p => p.r === k).length}</em></button>`).join("")}</div>`).join("")}
        <div><button class="pill" id="legall" style="width:auto">Show all</button></div></div>
    </div></section>`;
  const draw = () => drawMap($("#bigmap"), { roleOn: st.on, lg: st.lg, highlight: st.sel !== null ? [st.sel] : [], labels: true, big: true });
  $("#leg").addEventListener("click", e => { const b = e.target.closest("button[data-k]"); if (b) { const k = +b.dataset.k; st.on.has(k) ? st.on.delete(k) : st.on.add(k); b.classList.toggle("off", !st.on.has(k)); b.setAttribute("aria-pressed", st.on.has(k)); draw(); } });
  $("#legall").addEventListener("click", () => { st.on = new Set(ROLES.map((_, k) => k)); pages.map(); });
  $("#maplg").value = st.lg; $("#maplg").addEventListener("change", e => { st.lg = e.target.value; draw(); });
  searchBox($("#mapq"), p => { if (isGK(p)) return; st.sel = p.i; draw(); }, "Find a player on the map");
  draw();
};

// ---------- out of position ----------
pages.misfits = () => {
  app.innerHTML = `<section class="sheet">
    <div class="shead"><div><span class="k acc">Out of position</span><h1 style="margin-top:6px">Listed in one position, plays like another</h1><p class="lead" style="margin-top:8px">For each player we looked at his 10 closest matches by style. These ${X.misfits.length} players have at least 6 of the 10 in a different position group from their own.</p></div></div>
    <div class="cols"><div><div class="tscroll"><table><thead><tr><th>Player</th><th>Club</th><th>Listed as</th><th>Plays like</th><th class="n">Matches elsewhere</th></tr></thead><tbody>${X.misfits.map(m => { const p = P[m.i]; return `<tr class="link" data-i="${p.i}"><td><a href="#player-${p.i}"><b>${esc(p.n)}</b></a></td><td class="muted">${esc(p.t)}</td><td class="muted">${esc(p.p)}</td><td>${roleChip(m.like_role, false)}</td><td class="n" style="color:${m.share >= .9 ? "var(--accent)" : "var(--text)"}">${Math.round(m.share * 10)} of 10</td></tr>`; }).join("")}</tbody></table></div>
    <p class="xs muted" style="margin-top:10px">“Plays like” is the most common role among his closest matches from the other position group. Positions are StatsBomb’s most frequent label for the player that season.</p></div></div></section>`;
  app.querySelectorAll("tr[data-i]").forEach(tr => tr.addEventListener("click", e => { if (!e.target.closest("a")) go("player-" + tr.dataset.i); }));
};

// ---------- seasons ----------
pages.seasons = (arg) => {
  const SS = S.seasons, c = S.check;
  let k = +arg; if (!(k in SS)) k = SS.findIndex(x => x.t === "Barcelona" && x.s === "2008/09");
  const cur = SS[k], squad = SP.filter(p => p.k === "club" && p.t === cur.t && p.s === cur.s).sort((a, b) => FAMS.indexOf(a.fam) - FAMS.indexOf(b.fam) || b.min - a.min);
  const clubs = [...new Set(SS.map(x => x.t))];
  app.innerHTML = `<section class="sheet">
    <div class="shead"><div class="stack" style="gap:8px;max-width:760px"><span class="k acc">Seasons</span><h1>Other seasons, measured against 2015/16</h1>
      <p class="lead">StatsBomb’s free data also has every league match of a few clubs in other seasons. Each of their players with 900+ minutes gets a profile for that season, measured on the same scale as 2015/16, so you can ask who in 2015/16 played like Xavi in 2008/09. Every 2015/16 player also has an August–December and a January–May profile.</p></div></div>
    <div class="cols c2w">
      <div class="stack">${sec("I. Club seasons", `${SS.length}`)}
        ${clubs.map(t => `<div class="stack" style="gap:6px"><b class="small">${esc(t)}</b><div class="row" style="gap:6px">${SS.map((x, j) => x.t === t ? `<a class="pill${j === k ? " on" : ""}" href="#seasons-${j}"${j === k ? ' aria-current="page"' : ""}>${esc(x.s)}</a>` : "").join("")}</div></div>`).join("")}
        ${sec("II. Does it hold up?")}
        <div class="figs">${fig(c.other_seasons.adjacent_top5 + "%", "Own 2015/16 in top 5", true)}${fig(c.halves.top5 + "%", "Aug–Dec finds Jan–May")}</div>
        <p class="xs muted">${c.other_seasons.adjacent_n} Barcelona players have a 2014/15 or 2016/17 season next to their 2015/16 one: their own 2015/16 profile is in their top 5 of ${c.other_seasons.pool.toLocaleString()} players ${c.other_seasons.adjacent_top5}% of the time (median rank ${c.other_seasons.adjacent_median_rank}). Seasons further apart drift more (top 5: ${c.other_seasons.top5}% over all ${c.other_seasons.n}). From his August–December profile, a player’s January–May profile is in his top 5 ${c.halves.top5}% of the time (${c.halves.n} players; chance under 1%).</p>
      </div>
      <div>${sec(`III. ${esc(cur.t)} ${esc(cur.s)}`, `${squad.length} players · ${esc(cur.l)}`)}
        <div class="tscroll"><table><thead><tr><th>Player</th><th>Position</th><th class="n">Minutes</th><th>Role</th><th>Most like, in 2015/16</th><th class="n">Match</th></tr></thead><tbody>
        ${squad.map(p => { const nb = neighbours(p.i, () => true, 1)[0]; return `<tr class="link" data-i="${p.i}"><td><a href="#player-${p.i}"><b>${esc(p.n)}</b></a></td><td class="muted">${esc(p.p)}</td><td class="n">${p.min.toLocaleString()}</td><td>${roleChip(p.r, false)}</td><td><a href="#compare-${p.i}-${nb.b.i}" title="${esc(nb.b.t)}">${esc(nb.b.n)}</a></td><td class="n num">${Math.round(nb.s)}</td></tr>`; }).join("") || `<tr><td colspan="6" class="empty">No player reached 900 minutes in the open matches of this season.</td></tr>`}
        </tbody></table></div>
        <p class="xs muted" style="margin-top:10px">Only ${esc(cur.t)}’s players: their opponents appear once or twice, too little to describe them. Open a player to see all his seasons and find replacements for each.</p></div>
    </div></section>`;
  app.querySelectorAll("tr[data-i]").forEach(tr => tr.addEventListener("click", e => { if (!e.target.closest("a")) go("player-" + tr.dataset.i); }));
};

// ---------- method ----------
pages.method = () => {
  const v = X.validation, g = D.gk.check, nGK = P.filter(isGK).length;
  const part = (no, title, body) => `<div class="no">${no}</div><div class="body"><h2>${title}</h2>${body}</div>`;
  app.innerHTML = `<section class="sheet">
    <div class="shead"><div><span class="k acc">Method</span><h1 style="margin-top:6px">How it works, how it was checked, and its limits</h1></div></div>
    <div class="article">
      ${part("01", "Describe how each player plays", `<p>From StatsBomb’s event data (every pass, carry, shot, pressure and duel in 1,517 matches) each outfield player gets <b>42 numbers</b>: passing style, carrying and dribbling, shooting, defending, and where on the pitch he gets the ball. Counts are per 90 minutes, and defensive actions are adjusted for how much possession his team had.</p><p>Only player-seasons with <b>900+ minutes</b> are included: ${(P.length - nGK).toLocaleString()} outfield players and ${nGK} goalkeepers.</p>`)}
      ${part("02", "Machine learning used", `<ul><li><b>PCA</b> compresses the 42 stats into 8 dimensions that keep 85% of the variation: the style fingerprint.</li><li><b>Nearest-neighbour search</b> finds the closest players in that space; the 0–100 match score is a scaled distance.</li><li><b>k-means clustering</b>, run separately for each position group, creates the roles. Bootstrap stability, a Gaussian mixture model (BIC) and silhouette scores chose how many.</li><li><b>UMAP</b> flattens the 8 dimensions into the 2D role map.</li></ul><p>All of it is unsupervised: no model was trained to predict a known answer.</p>`)}
      ${part("03", "Checks", `<ul><li><b>Split-half test.</b> Each player’s stats were rebuilt from odd and even matches separately (${v.pool} players). From one half, his other half is his closest match ${v.top1}% of the time and in his top 5 ${v.top5}% of the time (chance: 0.1% and 0.5%). Median rank: ${v.median_rank}.</li><li><b>Role stability.</b> The two halves land in the same role ${v.role_agree}% of the time.</li><li><b>Team leakage.</b> ${v.team_leak}% of top-5 matches are team-mates, against ${v.team_leak_random}% by chance.</li><li><b>How many roles?</b> Stability fell below 0.7 beyond 2 roles per position (5 for attackers), so style within a position is mostly a spectrum and the similarity search is the main tool.</li></ul>`)}
      ${part("04", "Goalkeepers", `<p>Keepers get their own ${GF.length} stats and their own style space, and are only compared with other keepers: shot-stopping (save %, goals prevented against xG, xG per shot faced), distribution (passes, completion, pass and goal-kick length, long launches, short goal kicks), sweeping, and dealing with crosses.</p><p>Two styles are stable (stability ${g.stability}): ball-playing and long-ball keepers. In the split-half test a keeper’s other half is in his top 5 ${g.top5}% of the time (chance ${g.random_top5}%), and ${g.role_agree}% keep the same style in both halves. That is weaker than for outfield players: only ${g.n} keepers, and shot-stopping swings a lot over half a season.</p>`)}
      ${part("05", "Other seasons", `<p>StatsBomb’s free data covers every club only in 2015/16. For a few clubs it also has every league match of other seasons: Barcelona 2004/05 to 2020/21, Arsenal 2003/04, Paris Saint-Germain 2021/22 and 2022/23, and Bayer Leverkusen 2023/24. Those clubs’ players with 900+ minutes get a profile for each season (${SP.filter(p => p.k === "club").length} profiles).</p><p>The model is <b>not</b> refitted: the same standardisation, PCA and role centres from 2015/16 are applied unchanged, so a 2008/09 season and a 2015/16 season sit in the same space and can be matched. Matches for a past season are always 2015/16 players. Every 2015/16 player also gets an August–December and a January–May profile (600+ minutes each, 450 for keepers).</p><p>Check: a Barcelona player’s 2014/15 or 2016/17 profile finds his own 2015/16 profile in its top 5 ${S.check.other_seasons.adjacent_top5}% of the time (median rank ${S.check.other_seasons.adjacent_median_rank} of ${S.check.other_seasons.pool.toLocaleString()}).</p>`)}
      ${part("06", "Limits", `<ul><li>Full league coverage is for one season, 2015/16; other seasons cover one club, and many of these players have since retired or changed role.</li><li>A past season is matched against 2015/16 players, not against the players of its own year, and a player at a dominant club like Barcelona can look different from anyone in a normal team.</li><li>Style is partly the team’s system. Only defensive actions are adjusted for possession.</li><li>StatsBomb’s free data has no second or third divisions, and its other seasons cover a single club each, so these four leagues in 2015/16 are what is possible. In 2015/16 the Bundesliga has only 34 matches; Ligue 1 is missing 3.</li><li>“Goals prevented” uses pre-shot xG, because the free data has no post-shot xG.</li><li>“% alike” and the match score can disagree: the score weights the stats that best separate styles.</li></ul>`)}
      ${part("07", "Data and credit", `<p>All data comes from the <a class="acc" href="https://github.com/statsbomb/open-data">StatsBomb open data</a> repository and is used under the StatsBomb Public Data User Agreement. The raw data is not redistributed; this site shows derived statistics and analysis only. Analysis by Syed Hammad Ovais; not StatsBomb’s views.</p><span class="sb" style="align-self:flex-start"><img src="img/statsbomb-logo.png" alt="StatsBomb"></span>`)}
    </div></section>`;
};
function notFound() { app.innerHTML = `<section class="sheet"><div class="shead"><div><span class="k acc">404</span><h1 style="margin-top:6px">Page not found</h1><p class="meta">That link doesn’t match a page. <a class="acc" href="#home">Go to the home page</a>.</p></div></div></section>`; }

// ---------- router ----------
function go(h) { if (location.hash.slice(1) === h) route(); else location.hash = h; }
function route() {
  const h = location.hash.slice(1) || "home";
  const m = h.match(/^([a-z]+)(?:-(.*))?$/);
  const name = m ? m[1] : "home", arg = m ? m[2] : undefined;
  const fn = pages[name];
  const navKey = { player: "players", role: "roles", team: "teams" }[name] || name;
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.p === navKey));
  if (!fn) notFound(); else fn(arg);
  const titles = { player: () => ALL[+arg] && (ALL[+arg].n + (ALL[+arg].sea ? " " + sLabel(ALL[+arg]) : "")), role: () => R[+arg]?.name, team: () => T.teams[+arg]?.t, compare: () => "Compare", replace: () => "Replace a player", roles: () => "Roles", teams: () => "Teams", map: () => "Role map", misfits: () => "Out of position", seasons: () => "Seasons", method: () => "Method", players: () => "Players" };
  document.title = (titles[name] && titles[name]() ? titles[name]() + " · " : "") + "Player Style Finder";
  window.scrollTo(0, 0);
}
Promise.all(["players", "teams", "roles", "extras", "seasons"].map(f => fetch(`data/${f}.json`).then(r => { if (!r.ok) throw new Error(f); return r.json(); })))
  .then(([a, b, c, d, e]) => { D = a; T = b; R = c; X = d; S = e; prepData(); searchBox($("#navsearch"), p => go("player-" + p.i), "Search players"); route(); window.addEventListener("hashchange", route); })
  .catch(err => { app.innerHTML = `<div class="sheet empty"><h2>The data didn’t load</h2><p class="muted">Reload the page to try again. (${esc(err.message)})</p></div>`; });
</script>
</body>
